<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POP PAINT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">POP PAINT</div>
    <nav>
      <a href="#draw">그리기</a>
      <a href="#save">저장</a>
    </nav>
  </header>

  <main class="main">
    <section class="hero" id="draw">
      <h1>🎨 POP PAINT</h1>
      <p>브라우저에서 바로 그림을 그리고 PNG로 저장해보세요.</p>

      <div class="welcome">
        <div class="toolbar">
          <div class="color-tools">
            <button type="button" class="color-button active" data-color="#000000" style="background:#000000" aria-label="검정"></button>
            <button type="button" class="color-button" data-color="#0000ff" style="background:#0000ff" aria-label="파랑"></button>
            <button type="button" class="color-button" data-color="#ff0000" style="background:#ff0000" aria-label="빨강"></button>
            <button type="button" class="color-button" data-color="#00aa00" style="background:#00aa00" aria-label="초록"></button>
            <button type="button" class="color-button" data-color="#ffd000" style="background:#ffd000" aria-label="노랑"></button>
          </div>

          <button type="button" id="eraserButton" class="tool-button">🧽 지우개</button>
          <button type="button" id="clearButton" class="tool-button danger">🗑️ 전체 지우기</button>
        </div>

        <div class="canvas-container">
          <canvas id="paintCanvas" width="1200" height="700"></canvas>
        </div>

        <div class="save-area" id="save">
          <input type="text" id="drawingTitle" placeholder="그림 제목" maxlength="100" />
          <textarea id="drawingDescription" placeholder="그림 설명" maxlength="1000"></textarea>
          <button type="button" id="saveButton" class="button primary">💾 PNG로 저장</button>
        </div>

        <div class="draw-footer">
          <span id="currentTool">현재 도구: 검정색 펜</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
