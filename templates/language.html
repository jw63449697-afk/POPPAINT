<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>POP PAINT</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <main class="language-page">

        <div class="language-box">

            <div class="logo">
                POP PAINT
            </div>

            <h1>
                언어를 선택하세요
            </h1>

            <p>
                Choose your language
            </p>

            <div class="language-buttons">

                <a
                    href="{{ url_for('set_language', language='ko') }}"
                    class="button primary"
                >
                    🇰🇷 한국어
                </a>

                <a
                    href="{{ url_for('set_language', language='en') }}"
                    class="button"
                >
                    🇺🇸 English
                </a>

            </div>

        </div>

    </main>

</body>

</html>
